[project]
name = "runanywhere-finetune-server"
version = "0.1.0"
description = "RunAnywhere OTA Fine-Tuning Cloud Server - Host on your laptop to fine-tune models and deliver LoRA adapters OTA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.7",
    "httpx>=0.27.0",
    "peft>=0.10.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "llama-cpp-python>=0.2.56",
    "safetensors>=0.4.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
unsloth = ["unsloth>=2024.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
